<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">AI Article Check icon</title>
  <desc id="description">A magnifying glass reveals AI signals inside a web article.</desc>
  <defs>
    <clipPath id="lens">
      <circle cx="77" cy="73" r="34"/>
    </clipPath>
  </defs>

  <!-- Website/article -->
  <rect x="10" y="10" width="86" height="96" rx="10" fill="#0b1f3a" stroke="#183b63" stroke-width="2"/>
  <circle cx="22" cy="23" r="2.5" fill="#dbeafe"/>
  <circle cx="31" cy="23" r="2.5" fill="#dbeafe"/>
  <circle cx="40" cy="23" r="2.5" fill="#dbeafe"/>
  <path d="M51 23h31M21 36h62M21 47h45M21 58h57M21 69h42M21 80h55M21 91h49"
        fill="none" stroke="#dbeafe" stroke-linecap="round" stroke-width="4"/>

  <!-- Article content remains visible through the clear lens. -->
  <g clip-path="url(#lens)" opacity=".48">
    <path d="M39 43h73M38 55h70M38 67h75M38 79h72M38 91h69"
          fill="none" stroke="#f8fafc" stroke-linecap="round" stroke-width="4.5"/>
  </g>

  <!-- Detected article strokes resolve into AI inside the lens. -->
  <g clip-path="url(#lens)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
    <path d="M54 86 65 55 76 86M59 73h12" stroke="#8b5cf6" stroke-dasharray="5 2.5"/>
    <path d="M85 56v30" stroke="#22d3ee" stroke-dasharray="5 2.5"/>
  </g>

  <!-- Detailed magnifier: dark structural edge, cyan frame, inner rim and glass highlight. -->
  <circle cx="77" cy="73" r="37" fill="none" stroke="#06172c" stroke-width="10"/>
  <circle cx="77" cy="73" r="37" fill="none" stroke="#06b6d4" stroke-width="7"/>
  <circle cx="77" cy="73" r="33" fill="none" stroke="#7dd3fc" stroke-width="1.8"/>
  <path d="M53 50a33 33 0 0 1 39-5" fill="none" stroke="#e0f2fe" stroke-linecap="round" stroke-width="2.2" opacity=".9"/>

  <!-- Reinforced neck and outlined handle. -->
  <path d="m103 99 18 18" fill="none" stroke="#06172c" stroke-linecap="round" stroke-width="15"/>
  <path d="m103 99 18 18" fill="none" stroke="#06b6d4" stroke-linecap="round" stroke-width="10"/>
  <path d="m105 99 17 17" fill="none" stroke="#7dd3fc" stroke-linecap="round" stroke-width="2" opacity=".9"/>
</svg>
